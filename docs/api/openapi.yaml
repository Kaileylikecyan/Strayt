          type: boolean
        project_id:
          title: Project Id
          type: string
        sort_order:
          title: Sort Order
          type: integer
        status:
          enum:
          - todo
          - doing
          - done
          title: Status
          type: string
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        title:
          title: Title
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - project_id
      - title
      - due_date
      - status
      - target_type
      - target_id
      - sort_order
      - created_at
      - updated_at
      title: PlanListOut
      type: object
    ProjectCreate:
      properties:
        api_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Profile Id
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        type:
          enum:
          - graph
          - recite
          title: Type
          type: string
      required:
      - name
      - type
      title: ProjectCreate
      type: object
    ProjectOut:
      properties:
        api_profile_json:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Api Profile Json
        created_at:
          format: date-time
          title: Created At
          type: string
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        type:
          enum:
          - graph
          - recite
          title: Type
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name
      - type
      - created_at
      - updated_at
      title: ProjectOut
      type: object
    SessionOut:
      description: '登录/创建口令成功后下发的会话令牌。


        令牌是 HMAC 签名（不是随机串），因此服务端无需会话表；它的有效期由

        签发时的 TTL 决定，改口令会让它立刻失效。**只在响应里出现，不写日志。**'
      properties:
        expires_at:
          format: date-time
          title: Expires At
          type: string
        session_token:
          title: Session Token
          type: string
      required:
      - session_token
      - expires_at
      title: SessionOut
      type: object
    UploadSessionCreate:
      description: 客户端先声明文件指纹，服务端据此判断走直传还是分块。
      properties:
        orig_name:
          maxLength: 255
          minLength: 1
          title: Orig Name
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        size:
          minimum: 1.0
          title: Size
          type: integer
      required:
      - orig_name
      - size
      - sha256
      title: UploadSessionCreate
      type: object
    UploadSessionOut:
      properties:
        chunk_size:
          title: Chunk Size
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        orig_name:
          title: Orig Name
          type: string
        project_id:
          title: Project Id
          type: string
        received_json:
          additionalProperties: true
          title: Received Json
          type: object
        sha256:
          title: Sha256
          type: string
        size:
          title: Size
          type: integer
        status:
          enum:
          - pending
          - complete
          - aborted
          title: Status
          type: string
        total_chunks:
          title: Total Chunks
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - project_id
      - orig_name
      - size
      - sha256
      - chunk_size
      - total_chunks
      - received_json
      - status
      - created_at
      - updated_at
      title: UploadSessionOut
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: '学习工作台 Strayt 服务端。


    单用户免账号：所有 `/api/v1` 端点需 `Authorization: Bearer <访问令牌>`。

    唯一豁免是 `/health`（存活探针）。


    错误体统一为 `{ "error": { "code", "message", "detail?" } }`，`code` 是稳定契约，客户端据此分支。'
  title: Strayt 学习工作台
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: 口令换会话令牌。
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - 访问口令登录
  /api/v1/auth/password:
    post:
      description: '改口令。鉴权由 ``router2`` 在 ``main.py`` 挂载时用 ``AuthDep`` 施加。


        改完立刻返回**新**会话令牌：签名密钥由口令哈希派生，换口令等于换密钥，

        客户端手上那个旧令牌当场作废。不回传的话用户会被自己踢下线，得重新输一遍。'
      operationId: change_password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Change Password
      tags:
      - 访问口令登录
  /api/v1/auth/setup:
    post:
      description: '首次创建口令。已设置过则 409 —— 不给「静默覆盖」留口子。


        口令强度已由 ``PasswordIn`` 的字段校验器把关（弱口令 → 422），这里

        ``hash_password`` 只会因内部不一致抛错，那确实是 500。'
      operationId: setup_password_api_v1_auth_setup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Setup Password
      tags:
      - 访问口令登录
  /api/v1/auth/state:
    get:
      description: 是否已设置口令。免鉴权 —— 客户端首屏就要知道该显示哪个表单。
      operationId: auth_state_api_v1_auth_state_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStateOut'
          description: Successful Response
      summary: Auth State
      tags:
      - 访问口令登录
  /api/v1/checkins:
    put:
      operationId: put_checkin_api_v1_checkins_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 打卡（同日覆盖）
      tags:
      - 背诵舱 / 打卡
  /api/v1/checkins/{day}:
    get:
      operationId: get_checkin_api_v1_checkins__day__get
      parameters:
      - in: path
        name: day
        required: true
        schema:
          format: date
          title: Day
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 查某天打卡
      tags:
      - 背诵舱 / 打卡
  /api/v1/export/snapshot:
    get:
      operationId: export_snapshot_api_v1_export_snapshot_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Export Snapshot Api V1 Export Snapshot Get
                type: object
          description: Successful Response
      summary: 全部项目数据一键导出 JSON 快照
      tags:
      - 数据导出
  /api/v1/files:
    get:
      operationId: list_files_api_v1_files_get
      parameters:
      - in: query
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileOut'
                title: Response List Files Api V1 Files Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 项目资料列表
      tags:
      - 文件
    post:
      operationId: upload_direct_api_v1_files_post
      parameters:
      - in: query
        name: project_id
        required: true
        schema:
          title: Project Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_direct_api_v1_files_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 直传上传（≤50MB）
      tags:
      - 文件
  /api/v1/files/{file_id}:
    delete:
      operationId: delete_file_api_v1_files__file_id__delete
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 软删文件（实体移入回收站）
      tags:
      - 文件
  /api/v1/files/{file_id}/raw:
    get:
      operationId: download_raw_api_v1_files__file_id__raw_get
      parameters:
      - in: path
        name: file_id
        required: true
        schema:
          title: File Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 下载原始文件（出处回看二期用）
      tags:
      - 文件
  /api/v1/flashcards/{flashcard_id}/result:
    post:
      description: 答对/答错推进一档掌握度（no↔mid↔yes），两端钳位。
      operationId: post_flashcard_result_api_v1_flashcards__flashcard_id__result_post
      parameters:
      - in: path
        name: flashcard_id
        required: true
        schema:
          title: Flashcard Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlashcardResultIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlashcardResultOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 自测结果回写
      tags:
      - 闪卡自测
  /api/v1/jobs:
    get:
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - pattern: ^(queued|running|success|failed|cancelled|interrupted)$
            type: string
          - type: 'null'
          title: Status
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobOut'
                title: Response List Jobs Api V1 Jobs Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 任务列表
      tags:
      - 加工任务
    post:
      description: '入队并立即在服务端后台开跑，客户端可以关窗。


        任务表里同时写 ``file_id``，断点续跑靠它找回要加工的文件。

        图谱任务在创建时就校验 LLM 配置：没有模型就没有知识点，与其建一个

        必然会失败的活，不如一开始就拦住并说明原因。'
      operationId: create_job_api_v1_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 新建加工任务并开跑
      tags:
      - 加工任务
  /api/v1/jobs/{job_id}:
    get:
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 任务详情（含逐章进度与断点）
      tags:
      - 加工任务
  /api/v1/jobs/{job_id}/cancel:
    post:
      operationId: cancel_job_api_v1_jobs__job_id__cancel_post
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 取消排队中、运行中或已中断的任务
      tags:
      - 加工任务
  /api/v1/jobs/{job_id}/graph-confirm:
    post:
      description: 把草稿（带手动调整）一次性原子落库，覆盖项目旧图谱。
      operationId: confirm_graph_api_v1_jobs__job_id__graph_confirm_post
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphConfirmIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphConfirmOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 预览确认并入库
      tags:
      - 知识图谱
  /api/v1/jobs/{job_id}/graph-draft:
    get:
      description: 抽取任务完成后的预览草稿（尚未落正式表）。
      operationId: get_graph_draft_api_v1_jobs__job_id__graph_draft_get
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphDraftOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 阅读取预览草稿
      tags:
      - 知识图谱
  /api/v1/jobs/{job_id}/resume:
    post:
      operationId: resume_job_api_v1_jobs__job_id__resume_post
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          title: Job Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 断点续跑失败或已中断的任务
      tags:
      - 加工任务
  /api/v1/nodes/{node_id}/mastery:
    put:
      description: 直接写掌握度（在线路径）。离线走弱同步 ``node_mastery`` 实体。
      operationId: put_node_mastery_api_v1_nodes__node_id__mastery_put
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          title: Node Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasteryIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeMasteryOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 设置节点掌握度
      tags:
      - 知识图谱
  /api/v1/plans:
    get:
      operationId: list_plans_api_v1_plans_get
      parameters:
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - pattern: ^(todo|doing|done)$
            type: string
          - type: 'null'
          title: Status
      - description: 排序参考日（used for 逾期判定），默认今天
        in: query
        name: ref_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 排序参考日（used for 逾期判定），默认今天
          title: Ref Date
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanListOut'
                title: Response List Plans Api V1 Plans Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 阶段计划列表
      tags:
      - 学习路径
  /api/v1/plans/daily:
    get:
      operationId: daily_todos_api_v1_plans_daily_get
      parameters:
      - description: 待办日，默认今天
        in: query
        name: day
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 待办日，默认今天
          title: Day
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Daily Todos Api V1 Plans Daily Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 每日待办聚合
      tags:
      - 学习路径
  /api/v1/projects:
    get:
      operationId: list_projects_api_v1_projects_get
      parameters:
      - description: 回收站视图：只列已删项目
        in: query
        name: include_deleted
        required: false
        schema:
          default: false
          description: 回收站视图：只列已删项目
          title: Include Deleted
          type: boolean
      - in: query
        name: type
        required: false
        schema:
          anyOf:
          - pattern: ^(graph|recite)$
            type: string
          - type: 'null'
          title: Type
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectOut'
                title: Response List Projects Api V1 Projects Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 项目列表
      tags:
      - 项目
    post:
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
          description: Successful Response
        '422':
          content:
            application/json:
