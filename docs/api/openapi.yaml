        版面块时，按「首字符所在块」归属与 ``_attach_block_numbers`` 的口径一致 ——

        客户端按块号聚合成背诵单元，取靠前的块意味着这一单元以靠前的段为准，

        而不是被吞掉的那一段从列表里凭空消失。'
