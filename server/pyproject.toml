[project]
name = "strayt-server"
version = "0.1.0"
description = "学习工作台 Strayt · 服务端（瘦客户端 + 胖服务端）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.34",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pypdf>=6.19",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "argon2-cffi>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",
]
ignore = [
    "E501",    # 行宽交给 formatter
    "B008",    # FastAPI Depends() 默认值是惯用写法
    "RUF001",  # 中文全角标点
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# tests/ 是包（有 __init__.py），于是测试模块能以 `tests.conftest` 被导入。
# 没有它时 `from tests.conftest import ...` 会 ModuleNotFoundError ——
# conftest.py 由 pytest 以插件方式加载，并不在 sys.path 上。
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
